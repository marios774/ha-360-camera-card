name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Verify clean build
        run: git diff --exit-code -- dist/ha-360-camera-card.js
