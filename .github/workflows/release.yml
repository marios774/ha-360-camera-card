name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm install
      - run: npm run build
      - run: npm test

      - name: Create release archive
        run: |
          mkdir release
          cp dist/ha-360-camera-card.js release/
          cp README.md LICENSE hacs.json release/
          cd release
          zip -r ../ha-360-camera-card.zip .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/ha-360-camera-card.js
            ha-360-camera-card.zip
